<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Convert SVG to PNG</title>
</head>
<body style="background: #222; color: #fff; font-family: sans-serif; padding: 20px;">
  <h2>Converting SVG to PNG...</h2>
  <div id="status">Loading...</div>
  <canvas id="c512" width="512" height="512" style="border: 1px solid #444; width: 128px; height: 128px;"></canvas>
  <canvas id="c192" width="192" height="192" style="border: 1px solid #444; width: 128px; height: 128px;"></canvas>
  <canvas id="c180" width="180" height="180" style="border: 1px solid #444; width: 128px; height: 128px;"></canvas>
  <br>
  <textarea id="data512" style="width: 100%; height: 100px;"></textarea>
  <textarea id="data192" style="width: 100%; height: 100px;"></textarea>
  <textarea id="data180" style="width: 100%; height: 100px;"></textarea>

  <script>
    const svgString = `<svg id="Capa_1" data-name="Capa 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 763.12 763.49"><defs><style>.cls-1{fill:#0e0e0e;}.cls-2{fill:#fffceb;}</style></defs><rect class="cls-1" width="763.12" height="763.49"/><path class="cls-2" d="M377.13,300.87c10.57-2.41,21.43-3.27,32.24-3.83,25,.67-87.84,43.14-67.89,59-5.26-.83,128.41-38.87,123.11-39.48a162.53,162.53,0,0,0-50.23,2c-11,2.21-22,5.25-32.17,10.21A182.23,182.23,0,0,0,341.48,356c3.86-.76,7.66-1.8,11.5-2.67a228.64,228.64,0,0,1,54.74-4.8c33.27.78,66.54,6.5,97.81,18,20.53,7.63,40.35,17.66,57.71,31.13A94,94,0,0,1,574.79,408c-15.2-1.26-30.48-3.39-45.74-1.69A73,73,0,0,0,503.3,414c-11.27,5.81-20.62,14.61-29.49,23.53-16.69,16.84-33.13,34.85-54.66,45.59-14.27,7.52-30.46,10.5-46.46,10.85-14.86-.63-29.88-3.73-42.89-11.19-7-4-13.66-9.07-18.56-15.6,23.8,9.44,51.15,8.88,74.74-.91,11.45-4.86,21.67-12.18,30.86-20.49,17.19-15.39,32-33.6,51.38-46.41,4.27-2.88,8.9-5.13,13.36-7.7-7.63-1.13-15.35-1.19-23-1.71-13.55-.46-27.12-.73-40.69-.3-.17,5.67-.56,11.48-2.83,16.76a39,39,0,0,1-67.2,9.5c-3.59-4.43-5.63-9.81-7.26-15.19a123.68,123.68,0,0,0-23.38,9.07c1.81,13,10.86,23.7,21.45,30.79,8.27,5.69,17.91,9,27.72,10.81-4.73,1.83-9.83,2.21-14.84,2.59-17.82,1.08-36.1-4.16-50.24-15.17-6-4.52-10.81-10.35-15.11-16.46a114.72,114.72,0,0,1-54.3,3.6c-15.89-2.78-31.76-8.75-43.7-19.9a45.51,45.51,0,0,1-9-11.52c16.57,3.39,33.94,6.29,50.64,2,18.82-4.67,34.07-17.46,48.21-30.1,13.59-12.23,26.69-25.05,41.22-36.18,17.19-13.3,36.55-24.4,57.89-29.3M357.07,396a22.56,22.56,0,0,0,14.86,16.94,22,22,0,0,0,24.88-8.45,22.59,22.59,0,0,0,3.8-14.19,237.22,237.22,0,0,0-43.54,5.7Z"/></svg>`;

    const img = new Image();
    const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    img.onload = () => {
      // 512
      const c512 = document.getElementById('c512');
      const ctx512 = c512.getContext('2d');
      ctx512.fillStyle = '#0e0e0e';
      ctx512.fillRect(0, 0, 512, 512);
      ctx512.drawImage(img, 0, 0, 512, 512);
      document.getElementById('data512').value = c512.toDataURL('image/png');

      // 192
      const c192 = document.getElementById('c192');
      const ctx192 = c192.getContext('2d');
      ctx192.fillStyle = '#0e0e0e';
      ctx192.fillRect(0, 0, 192, 192);
      ctx192.drawImage(img, 0, 0, 192, 192);
      document.getElementById('data192').value = c192.toDataURL('image/png');

      // 180 (Apple Touch Icon)
      const c180 = document.getElementById('c180');
      const ctx180 = c180.getContext('2d');
      ctx180.fillStyle = '#0e0e0e';
      ctx180.fillRect(0, 0, 180, 180);
      ctx180.drawImage(img, 0, 0, 180, 180);
      document.getElementById('data180').value = c180.toDataURL('image/png');

      document.getElementById('status').innerText = 'DONE';
    };
    img.src = url;
  </script>
</body>
</html>
